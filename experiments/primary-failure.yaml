version: 1
name: primary-failure
environment:
  redis_image: redis:8.10.2-alpine
  node_timeout: 3s
workload:
  workers: 8
  rate_per_second: 200
  max_writes: 20000
  read_percent: 50
  value_bytes: 128
  seed: 42
  operation_timeout: 500ms
experiment:
  fault: primary-kill
  baseline: 10s
  post_recovery: 5s
  sample_interval: 500ms
  stable_for: 3s
  minimum_baseline_success: 0.99
timeouts:
  provision: 2m
  readiness: 1m
  recovery: 45s
  validation: 30s
  cleanup: 30s
