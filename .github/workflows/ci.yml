name: reliability-lab
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true
      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Check and build
        run: make check build
  docker-integration:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true
      - run: docker version
      - name: Run integration tests
        shell: bash
        timeout-minutes: 22
        run: |
          mkdir -p reports/ci
          make integration 2>&1 | tee reports/ci/integration.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-reports
          path: reports/ci/
          if-no-files-found: ignore
  aiops-evaluation:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true
      - name: Build offline CLI
        run: make build
      - name: Collect independent real Redis trials
        shell: bash
        env:
          REDIS_LAB_DATASET: reports/ci/aiops/dataset
        run: |
          mkdir -p reports/ci/aiops
          make aiops-integration 2>&1 | tee reports/ci/aiops/collection.log
      - name: Evaluate both partitions
        run: |
          bin/redis-lab evaluate --dataset reports/ci/aiops/dataset/manifest.json --partition development --output reports/ci/aiops/development
          bin/redis-lab evaluate --dataset reports/ci/aiops/dataset/manifest.json --partition heldout --output reports/ci/aiops/heldout
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: aiops-evidence
          path: reports/ci/aiops/
          if-no-files-found: ignore
